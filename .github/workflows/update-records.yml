name: Update records and deploy

on:
  schedule:
    - cron: "0 12 * * *"      # every day at 12:00 UTC (early morning US time)
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build records.json
        run: python3 scripts/build_records.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/records.json
          git diff --cached --quiet || (git commit -m "Update records" && git push)

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
