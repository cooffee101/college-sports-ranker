header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:3px solid var(--acc)}
h1{margin:0;font:800 26px/1 Impact,"Arial Narrow",sans-serif;letter-spacing:1px;text-transform:uppercase}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 12px}
main{display:grid;grid-template-columns:300px 1fr;gap:18px;padding:18px 20px;max-width:1400px;margin:auto}
aside{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;align-self:start;position:sticky;top:10px;max-height:calc(100vh - 20px);display:flex;flex-direction:column}

#pool{overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:80px}
.hint{font-size:12px;color:var(--mute);margin:0 0 8px}
.team{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:grab}
.team.sel{outline:2px solid var(--acc)}
.badge{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 11px system-ui;text-shadow:0 1px 1px #0006}
.nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec{font-size:12px;color:var(--mute);border:1px dashed var(--line);border-radius:10px;padding:1px 7px;cursor:text;white-space:nowrap}
main.full{grid-template-columns:1fr;max-width:none}main.full aside{display:none}
section{display:flex;flex-direction:column;gap:12px}
.slot{position:relative;background:var(--card);border:2px dashed var(--line);border-radius:10px;min-height:74px;display:flex;align-items:center;padding:8px 10px 8px 46px}
.slot.over{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.num{position:absolute;left:10px;top:50%;transform:translateY(-50%);font:800 24px Impact,sans-serif;color:var(--mute)}
.slot .team{flex:1;border:0;background:none;padding:0}
.x{position:absolute;right:6px;top:4px;border:0;background:none;color:var(--mute);padding:0 4px}
.slot.filled{border-style:solid}
.slot.filled .num{color:var(--acc)}
.hero{min-height:190px;padding-left:90px;background:linear-gradient(120deg,var(--hero),#2b3a4a);color:#fff;border-color:var(--acc)}
.hero .num{font-size:90px;left:22px;color:var(--acc)!important}
.hero .nm{font:800 clamp(28px,5vw,56px)/1 Impact,"Arial Narrow",sans-serif;text-transform:uppercase;white-space:normal}
.hero .badge{width:70px;height:70px;font-size:20px}.hero .rec{color:#ddd;font-size:16px}
.logo{flex:none;width:30px;height:30px;object-fit:contain;cursor:pointer}
.rows .logo{width:44px;height:44px}.row4 .logo{width:64px;height:64px}.hero .logo{width:140px;height:140px}
.hero:not(.filled){color:var(--mute)}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rows{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.row4 .slot{min-height:110px}.row4 .num{font-size:30px}
.rows .slot{padding-left:38px}.rows .num{font-size:20px;left:8px}
.rows .badge,.row4 .badge{width:26px;height:26px}
.rows .team,.row4 .team{flex-wrap:wrap}
@media(max-width:1000px){.rows{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){main{grid-template-columns:1fr}aside{position:static;max-height:360px}.row4{grid-template-columns:repeat(2,1fr)}.rows{grid-template-columns:repeat(2,1fr)}.hero{padding-left:70px}.hero .num{font-size:60px}}

#000000"],"Oklahoma":["#841617","#FDF9D8"],"Ole Miss":["#14213D","#CE1126"],"South Carolina":["#73000A","#000000"],"Tennessee":["#FF8200","#FFFFFF"],"Texas":["#BF5700","#FFFFFF"],"Texas A&M":["#500000","#FFFFFF"],"Vanderbilt":["#000000","#CFAE70"],"Appalachian State":["#000000","#FFCC00"],"Arkansas State":["#CC092F","#000000"],"Coastal Carolina":["#006F71","#A27752"],"Georgia Southern":["#011E41","#FFFFFF"],"Georgia State":["#0039A6","#C8102E"],"James Madison":["#450084","#CBB677"],"Louisiana":["#CE181E","#FFFFFF"],"Louisiana Tech":["#002F8B","#E31B23"],"Louisiana-Monroe":["#840029","#FFB81C"],"Marshall":["#00B140","#FFFFFF"],"Old Dominion":["#003057","#7C878E"],"South Alabama":["#00205B","#BF0D3E"],"Southern Miss":["#000000","#FFAB00"],"Troy":["#8A2432","#B3A369"]};
function helmet(n){const [a,b]=COL[n]||["#667","#ccc"];return `<svg class="logo" viewBox="0 0 100 100" data-l="${esc(n)}" role="img" aria-label="${esc(n)} helmet"><title>${esc(n)}</title><defs><clipPath id="hc"><path d="M16 62C10 36 30 14 56 14C76 14 89 28 89 46L87 52C80 54 75 58 73 64L72 74C68 80 60 83 52 81C46 79 42 79 38 81C24 81 18 73 16 62Z"/></clipPath></defs><path d="M16 62C10 36 30 14 56 14C76 14 89 28 89 46L87 52C80 54 75 58 73 64L72 74C68 80 60 83 52 81C46 79 42 79 38 81C24 81 18 73 16 62Z" fill="${a}"/><g clip-path="url(#hc)"><path d="M84 32C66 12 34 14 18 44" fill="none" stroke="${b}" stroke-width="8"/></g><path d="M16 62C10 36 30 14 56 14C76 14 89 28 89 46L87 52C80 54 75 58 73 64L72 74C68 80 60 83 52 81C46 79 42 79 38 81C24 81 18 73 16 62Z" fill="none" stroke="#0008" stroke-width="2" stroke-linejoin="round"/><path d="M33 27C43 19 55 17 65 20" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="62" r="6" fill="#0006"/><g fill="none" stroke="#8d939c" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M87 52C96 55 99 63 97 71C95 79 86 83 74 79"/><path d="M97.5 63L77 63M96.5 72L75 72M92 56C95 64 94 74 88 81"/></g></svg>`}
function team(n,s){const L=logos[n]||fileLogos[n];return `<div class="team${sel===n?" sel":""}" draggable="true" data-t="${esc(n)}">${L?`<img class="logo" src="${L}" alt="${esc(n)}" title="${esc(n)}" data-l="${esc(n)}">`:`${helmet(n)}`}<span class="nm">${esc(n)}</span><span class="rec" data-r="${esc(n)}" title="Click to edit record">${esc(rec[n]||"add record")}</span></div>`}
function slot(i){const n=rank[i];return `<div class="slot${i==0?" hero":""}${n?" filled":""}" data-i="${i}"><span class="num">${i+1}</span>${n?team(n,1)+'<button class="x" data-x="'+i+'">✕</button>':'<span style="color:var(--mute)">'+(i==0?"Drop your No. 1 team here":"Drop team")+'</span>'}</div>`}
function draw(){
 const ranked=new Set(rank),v=conf.value;
 const list=v==="*"?all:C[v.replace(/ \(\d+\)$/,"")];
 $("pool").innerHTML=list.filter(t=>!ranked.has(t)).map(team).join("")||'<p class="hint">Everyone in this conference is ranked.</p>';
 $("s1").innerHTML=slot(0);
 $("s2").innerHTML=[1,2,3,4].map(slot).join("");
 $("s3").innerHTML=Array.from({length:20},(_,k)=>slot(k+5)).join("");
 save();
 if(document.body.classList.contains("po"))renderPo();
}
document.addEventListener("dragstart",e=>{const t=e.target.closest(".team");if(!t)return;const s=t.closest(".slot");e.dataTransfer.setData("text/plain",JSON.stringify({t:t.dataset.t,f:s?+s.dataset.i:-1}))});
document.addEventListener("dragover",e=>{if(e.target.closest(".slot,#pool")){e.preventDefault();document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"));e.target.closest(".slot")?.classList.add("over")}});
document.addEventListener("dragend",()=>document.querySelectorAll(".over").forEach(x=>x.classList.remove("over")));
document.addEventListener("drop",e=>{
 let d;try{d=JSON.parse(e.dataTransfer.getData("text/plain"))}catch(x){return}
 const s=e.target.closest(".slot");
 if(s){e.preventDefault();place(+s.dataset.i,d.t,d.f)}
 else if(e.target.closest("#pool")){e.preventDefault();if(d.f>=0)rank[d.f]=null;draw()}
});
function place(i,t,from){const old=rank[i];if(from>=0)rank[from]=old;rank[i]=t;sel=null;draw()}
document.addEventListener("click",e=>{
 const lg=e.target.closest("[data-l]");if(lg){e.stopPropagation();pickFor=lg.dataset.l;$("one").click();return}
 const r=e.target.closest("[data-r]");
 if(r){e.stopPropagation();openGames(r.dataset.r);return}
 const x=e.target.closest("[data-x]");if(x){rank[+x.dataset.x]=null;draw();return}
 const s=e.target.closest(".slot");
 if(s&&sel){place(+s.dataset.i,sel,rank.indexOf(sel));return}
 const t=e.target.closest("#pool .team");
 if(t){sel=sel===t.dataset.t?null:t.dataset.t;draw()}
});
let edits={};try{edits=JSON.parse(localStorage.getItem("cfb26r")||"{}")}catch(e){}
async function refresh(manual){const m=$("asof");if(manual)m.textContent="Refreshing…";
 try{const r=await fetch("records.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();
  if(d.games)Object.assign(GAMES,d.games);for(const k in d.rec){base[k]=d.rec[k];if(!(k in edits))rec[k]=d.rec[k]}
  draw();m.textContent="Records through "+d.asOf+(manual?" ✓":"")}
 catch(e){m.textContent=manual?"Couldn't load records.json ("+(e.message||e)+")":""}}
$("refresh").onclick=()=>refresh(true);
refresh(false);
fetch("logos.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():{}).then(j=>{fileLogos=j||{};draw()}).catch(()=>{});
$("addl").onclick=()=>$("many").click();
const NICK={"Pitt":"Pittsburgh","App State":"Appalachian State","Appalachian":"Appalachian State","Massachusetts":"UMass","Connecticut":"UConn","ULM":"Louisiana-Monroe","UL Monroe":"Louisiana-Monroe","Louisiana Monroe":"Louisiana-Monroe","UL Lafayette":"Louisiana","Louisiana Lafayette":"Louisiana","NDSU":"North Dakota State","Mississippi":"Ole Miss","San Jose":"San Jose State","SJSU":"San Jose State","SDSU":"San Diego State","FAU":"Florida Atlantic","Florida International":"FIU","UCF":"UCF","Central Florida":"UCF","USF":"South Florida","Southern Mississippi":"Southern Miss","TAMU":"Texas A&M","Texas AM":"Texas A&M","Louisiana State":"LSU","UNC":"North Carolina","UNC Charlotte":"Charlotte","North Carolina State":"NC State","Cal":"California","WKU":"Western Kentucky","MTSU":"Middle Tennessee","ODU":"Old Dominion","JMU":"James Madison","FSU":"Florida State","ECU":"East Carolina","WVU":"West Virginia","BGSU":"Bowling Green","CMU":"Central Michigan","EMU":"Eastern Michigan","WMU":"Western Michigan","NIU":"Northern Illinois","UNM":"New Mexico","NMSU":"New Mexico State","ASU":"Arizona State","GSU":"Georgia State","TTU":"Texas Tech","OU":"Oklahoma","UGA":"Georgia","PSU":"Penn State","Miami Ohio":"Miami (OH)","Miami RedHawks":"Miami (OH)","Miami Florida":"Miami","Miami FL":"Miami","Hawai'i":"Hawaii","Sam Houston State":"Sam Houston","Louisiana Ragin Cajuns":"Louisiana","Army Black Knights":"Army","Sacramento":"Sacramento State"};
function keys(){const k=[];for(const t of all){k.push([norm(t),t]);if(/ State$/.test(t))k.push([norm(t.replace(/ State$/," St")),t])}for(const a in NICK)k.push([norm(a),NICK[a]]);return k}
$("many").onchange=async e=>{const KEYS=keys();let ok=0,miss=[];for(const f of e.target.files){const b=norm(f.name.replace(/\.[^.]+$/,""));const t=(KEYS.filter(k=>b.startsWith(k[0])).sort((a,c)=>c[0].length-a[0].length)[0]||[])[1];const d=t&&await shrink(f);if(d){logos[t]=d;ok++}else miss.push(f.name)}
 saveL();$("lmsg").textContent=ok+" logos added"+(miss.length?", "+miss.length+" unmatched (name files like \"Ohio State.png\")":"");e.target.value="";draw()};
$("one").onchange=async e=>{const f=e.target.files[0];if(f&&pickFor){const d=await shrink(f);if(d){logos[pickFor]=d;saveL()}}e.target.value="";draw()};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
function loadImg(n){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=logos[n]||fileLogos[n]||("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(helmet(n).replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" ')))})}
async function save2(name,data){try{const b=data instanceof Blob?data:new Blob([data],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);$("lmsg").textContent="Saved "+name}catch(e){$("lmsg").textContent="Save failed"}}
$("exp").onclick=async()=>{const W=1200,P=24,G=12,c=document.createElement("canvas");c.width=W;c.height=850;const x=c.getContext("2d");
 x.fillStyle="#f4f1ea";x.fillRect(0,0,W,850);x.textBaseline="middle";x.textAlign="left";
 x.fillStyle="#16202a";x.font="800 40px Impact,'Arial Narrow',sans-serif";x.fillText("MY TOP 25",P,40);x.fillStyle="#b3202a";x.fillRect(P,68,W-2*P,4);
 const im=await Promise.all(rank.map(n=>n?loadImg(n):null));
 function box(i,bx,by,w,h,ls,fs,ns,dk){const n=rank[i];x.setLineDash(n?[]:[6,5]);x.lineWidth=2;x.fillStyle=dk&&n?"#16202a":"#fff";x.strokeStyle=n&&dk?"#b3202a":"#d9d4c8";x.beginPath();x.roundRect(bx,by,w,h,10);x.fill();x.stroke();x.setLineDash([]);
  x.fillStyle=n?"#b3202a":"#9aa3ab";x.font=`800 ${ns}px Impact,sans-serif`;x.fillText(String(i+1),bx+14,by+h/2);if(!n)return;
  const lx=bx+14+x.measureText(String(i+1)).width+12,g=im[i];if(g){const k=Math.min(ls/g.width,ls/g.height);x.drawImage(g,lx+(ls-g.width*k)/2,by+(h-g.height*k)/2,g.width*k,g.height*k)}
  const tx=lx+ls+12,mw=bx+w-tx-10;let s=fs;do{x.font=`700 ${s}px system-ui,sans-serif`;s-=1}while(x.measureText(n).width>mw&&s>9);
  x.fillStyle=dk?"#fff":"#16202a";x.fillText(n,tx,by+h/2-(rec[n]?fs*0.3:0));
  if(rec[n]){x.font=`500 ${Math.round(fs*0.6)}px system-ui,sans-serif`;x.fillStyle=dk?"#c9d1d9":"#6b7682";x.fillText(rec[n],tx,by+h/2+fs*0.7)}}
 box(0,P,88,W-2*P,200,150,48,110,true);
 const w4=(W-2*P-3*G)/4;for(let i=1;i<5;i++)box(i,P+(i-1)*(w4+G),300,w4,120,64,22,56,false);
 const w5=(W-2*P-40)/5;for(let i=5;i<25;i++){const r=((i-5)/5)|0,k=(i-5)%5;box(i,P+k*(w5+10),432+r*98,w5,88,46,17,32,false)}
 c.toBlob(b=>b?save2("my-top-25.png",b):($("lmsg").textContent="Export failed"),"image/png")};
$("bak").onclick=()=>save2("cfb-top25-backup.json",JSON.stringify({rank,edits:Object.fromEntries(Object.entries(rec).filter(([k,v])=>base[k]!==v)),logos}));
$("rst").onclick=()=>$("rf").click();
$("rf").onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(Array.isArray(j.rank))rank=j.rank.slice(0,25);if(j.logos)Object.assign(logos,j.logos);if(j.edits){edits=j.edits;Object.assign(rec,edits)}saveL();$("lmsg").textContent="Backup restored";draw()}catch(x){$("lmsg").textContent="Couldn't read that file"}e.target.value=""};
function setFull(f){document.querySelector("main").classList.toggle("full",f);$("tog").textContent=f?"◨ Show teams":"◧ Hide teams";try{localStorage.setItem("cfb26p",f?"1":"")}catch(e){}}
$("tog").onclick=()=>setFull(!document.querySelector("main").classList.contains("full"));
try{if(localStorage.getItem("cfb26p"))setFull(true)}catch(e){}
let gmTeam=null;
function openGames(n){gmTeam=n;const gs=GAMES[n]||[];
 $("gmh").innerHTML="<h3>"+esc(n)+" <span class=\"hint\">"+esc(rec[n]||"")+"</span></h3>";
 $("gml").innerHTML=gs.length?gs.map(g=>{const[wk,o,s,pf,pa]=g,done=pf!=null,c=!done?"u":pf>pa?"w":pf<pa?"l":"";
  return `<div class="g ${c}"><span class="wk">Wk ${wk}</span><span>${s==="A"?"at":s==="N"?"vs (neutral)":"vs"} ${esc(o)}</span><b>${done?(pf>pa?"W ":pf<pa?"L ":"T ")+pf+"-"+pa:"upcoming"}</b></div>`}).join(""):'<p class="hint">No game data for this team.</p>';
 $("gm").showModal()}
$("gmc").onclick=()=>$("gm").close();
$("gm").onclick=e=>{if(e.target.id==="gm")$("gm").close()};
$("gme").onclick=()=>{const n=gmTeam,v=prompt("Record for "+n+" (e.g. 6-1):",rec[n]||"");if(v!==null){v.trim()?(rec[n]=edits[n]=v.trim()):(delete edits[n],base[n]?rec[n]=base[n]:delete rec[n]);draw();$("gm").close()}};
const G6=new Set(["American","Conference USA","MAC","Mountain West","Pac-12","Sun Belt"]);
const confOf={};for(const k in C)for(const t of C[k])confOf[t]=k;
const isG6=t=>G6.has(confOf[t])||t==="UConn";
function field(){const r=rank.filter(Boolean),g=r.find(isG6)||null;
 const rest=r.filter(t=>t!==g).slice(0,g?11:12);
 const f=(g?rest.concat([g]):rest).sort((a,b)=>rank.indexOf(a)-rank.indexOf(b));return{f,g,out:r.filter(t=>!f.includes(t))}}
function icon(n){const L=logos[n]||fileLogos[n];return L?`<img class="logo" src="${L}" alt="">`:helmet(n).replace(/ data-l="[^"]*"/,"")}
function renderPo(){const{f,g,out}=field();
 const chip=s=>{const n=f[s-1];return n?`<div class="pt"><span class="sd">${s}</span>${icon(n)}<span class="nm">${esc(n)}${n===g?'<span class="tg">G6 CHAMP</span>':""}</span><span class="rc">${esc(rec[n]||"")}</span></div>`:`<div class="pt empty"><span class="sd">${s}</span><span></span><span class="nm">Open spot</span><span></span></div>`};
 const tbd=t=>`<div class="pt tbd">${t}</div>`;
 const m=(a,b)=>`<div class="pm">${a}${b}</div>`;
 const fr=[[8,9],[5,12],[6,11],[7,10]].map(([a,b])=>m(chip(a),chip(b))).join("");
 const qf=[[1,"8/9"],[4,"5/12"],[3,"6/11"],[2,"7/10"]].map(([a,w])=>m(chip(a),tbd("Winner of "+w))).join("");
 const sf=m(tbd("Winner of QF 1 (1 vs 8/9)"),tbd("Winner of QF 2 (4 vs 5/12)"))+m(tbd("Winner of QF 3 (3 vs 6/11)"),tbd("Winner of QF 4 (2 vs 7/10)"));
 const fin=m(tbd("Winner of Semifinal 1"),tbd("Winner of Semifinal 2"));
 $("po").innerHTML=`<div class="pob">Your top 11 teams plus the highest-ranked Group of 6 team${g?" ("+esc(g)+")":" (none ranked yet, so the top 12 are shown)"}, seeded by your ranking. Seeds 1–4 get a first-round bye.</div>
 <div class="pocols"><div class="pcol"><h4>First Round</h4><div class="pcb">${fr}</div></div><div class="pcol"><h4>Quarterfinals</h4><div class="pcb">${qf}</div></div><div class="pcol"><h4>Semifinals</h4><div class="pcb">${sf}</div></div><div class="pcol"><h4>Championship</h4><div class="pcb">${fin}</div></div></div>`+
 (out.length?`<div class="pout">Out of the field: ${out.map(esc).join(", ")}</div>`:"")}
$("pob").onclick=()=>{const on=document.body.classList.toggle("po");$("pob").textContent=on?"← Back to Top 25":"🏆 12-Team Playoff";if(on)renderPo()};
$("reset").onclick=()=>{if(confirm("Clear your whole top 25?")){rank=Array(25).fill(null);sel=null;draw()}};
draw();
</script></body></html>
